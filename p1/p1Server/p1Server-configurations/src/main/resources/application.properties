chenile.base.url=http://localhost:8000
server.port=${SERVER_PORT:8000}
spring.application.name=p1Server
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.datasource.url=${PROCESS_DATABASE_URL:jdbc:h2:file:./.p1Server/data;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${PROCESS_DATABASE_USERNAME:sa}
spring.datasource.password=${PROCESS_DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${PROCESS_SCHEMA_MODE:update}
spring.jpa.open-in-view=false
spring.liquibase.enabled=false
spring.h2.console.enabled=${PROCESS_H2_CONSOLE_ENABLED:true}
chenile.process.configurator=json
chenile.process.outbox.run-dispatcher=true
pubsub.topic.separator=_
pubsub.publish.waitTime=${PUBSUB_PUBLISH_WAIT_TIME_MS:30000}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:chenile-process-outbox-schema.sql
chenile.process.management.enabled=true
chenile.process.management.api-key=${PROCESS_MANAGEMENT_API_KEY}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
