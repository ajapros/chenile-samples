spring.datasource.url=${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:55432/bulk_upload}
spring.datasource.username=${POSTGRES_USER:chenile}
spring.datasource.password=${POSTGRES_PASSWORD:chenile}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

bulk-upload.object-store.type=${OBJECT_STORE_TYPE:minio}
bulk-upload.object-store.endpoint=${OBJECT_STORE_ENDPOINT:http://localhost:9000}
bulk-upload.object-store.access-key=${OBJECT_STORE_ACCESS_KEY:minioadmin}
bulk-upload.object-store.secret-key=${OBJECT_STORE_SECRET_KEY:minioadmin}
bulk-upload.object-store.bucket=${OBJECT_STORE_BUCKET:chenile-bulk-upload}
