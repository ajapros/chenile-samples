server.port=8095

spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:chenile-process-work-schema.sql,classpath:schema.sql

bulk-upload.chunk-size=100
bulk-upload.object-store.type=filesystem
bulk-upload.object-store.root=${java.io.tmpdir}/chenile-bulk-upload

chenile.process.worker.jdbc.run-worker=false
chenile.process.worker.jdbc.run-once=false
chenile.process.worker.jdbc.lock-seconds=300
chenile.process.worker.jdbc.max-attempts=5
chenile.process.worker.jdbc.poll-interval-millis=1000
