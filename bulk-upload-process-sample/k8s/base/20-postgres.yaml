apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: chenile-bulk-upload
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: bulk_upload
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: bulk-upload-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bulk-upload-secret
                  key: POSTGRES_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: chenile-bulk-upload
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
