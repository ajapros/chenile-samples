apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: bulk-upload-worker-postgres
  namespace: chenile-bulk-upload
spec:
  scaleTargetRef:
    name: bulk-upload-worker
  minReplicaCount: 0
  maxReplicaCount: 10
  pollingInterval: 10
  cooldownPeriod: 60
  triggers:
    - type: postgresql
      authenticationRef:
        name: bulk-upload-postgres-auth
      metadata:
        host: postgres.chenile-bulk-upload.svc.cluster.local
        port: "5432"
        dbName: bulk_upload
        sslmode: disable
        query: "select count(*) from chenile_process_work_item where status = 'PENDING' or (status = 'RUNNING' and locked_until < now())"
        targetQueryValue: "1"
