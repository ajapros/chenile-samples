services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: auth_server
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_server"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "15432:5432"

  auth-server:
    build:
      context: ../../../..
      dockerfile: chenile-samples/security-auth-sample/runtime/Dockerfile
      args:
        MODULE: auth-server-app
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/config/auth-server-config.yml
      CHENILE_SECURITY_ISSUER_BASE: http://localhost:9000
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_server
      SPRING_DATASOURCE_USERNAME: auth_user
      SPRING_DATASOURCE_PASSWORD: auth_pass
    volumes:
      - ../config/auth-server-config.yml:/config/auth-server-config.yml:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9000:9000"

  service-a:
    build:
      context: ../../../..
      dockerfile: chenile-samples/security-auth-sample/runtime/Dockerfile
      args:
        MODULE: service-a
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/config/service-a-config.yml
      CHENILE_SECURITY_JWT_ISSUER_BASE: http://localhost:9000
      CHENILE_SECURITY_JWT_JWK_BASE_URI: http://auth-server:9000
      SAMPLE_SECURITY_SERVICE_B_URI: http://service-b:8082
    volumes:
      - ../config/service-a-config.yml:/config/service-a-config.yml:ro
    depends_on:
      - auth-server
    ports:
      - "8081:8081"

  service-b:
    build:
      context: ../../../..
      dockerfile: chenile-samples/security-auth-sample/runtime/Dockerfile
      args:
        MODULE: service-b
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/config/service-b-config.yml
      CHENILE_SECURITY_JWT_ISSUER_BASE: http://localhost:9000
      CHENILE_SECURITY_JWT_JWK_BASE_URI: http://auth-server:9000
    volumes:
      - ../config/service-b-config.yml:/config/service-b-config.yml:ro
    depends_on:
      - auth-server
    ports:
      - "8082:8082"

  gateway:
    build:
      context: ../../../..
      dockerfile: chenile-samples/security-auth-sample/runtime/Dockerfile
      args:
        MODULE: gateway-app
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/config/gateway-config.yml
    volumes:
      - ../config/gateway-config.yml:/config/gateway-config.yml:ro
    depends_on:
      - auth-server
      - service-a
      - service-b
    ports:
      - "8080:8080"
