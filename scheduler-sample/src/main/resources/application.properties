spring.application.name=chenile-scheduler-sample
server.port=${SERVER_PORT:8080}
spring.datasource.url=jdbc:h2:mem:chenile_scheduler_sample;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jackson.serialization.indent-output=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:chenile-scheduler-work-schema.sql
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info
