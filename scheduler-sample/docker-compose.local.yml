services:
  postgres:
    image: postgres:16
    container_name: chenile-scheduler-sample-postgres
    environment:
      POSTGRES_DB: scheduler
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - scheduler-sample-postgres:/var/lib/postgresql/data

volumes:
  scheduler-sample-postgres:
