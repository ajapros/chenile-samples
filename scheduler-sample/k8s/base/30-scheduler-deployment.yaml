apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler-sample
  namespace: chenile-scheduler-sample
  labels:
    app.kubernetes.io/name: scheduler-sample
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scheduler-sample
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scheduler-sample
    spec:
      serviceAccountName: scheduler-sample
      containers:
        - name: scheduler-sample
          image: example.com/chenile/scheduler-sample:0.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: scheduler-sample-config
            - secretRef:
                name: scheduler-sample-secret
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
