apiVersion: v1
kind: Service
metadata:
  name: scheduler-postgres
  namespace: chenile-scheduler-sample
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  selector:
    app.kubernetes.io/name: scheduler-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: scheduler-postgres
  namespace: chenile-scheduler-sample
spec:
  serviceName: scheduler-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scheduler-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scheduler-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: scheduler
            - name: POSTGRES_USER
              value: scheduler
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scheduler-sample-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
